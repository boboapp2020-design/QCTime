<html lang="th">
<head>
  <meta charset="UTF-8">

  <title>QC Time · Mitr Lao Sugar</title>
  <meta name="description" content="QC Time - ระบบงานควบคุมคุณภาพน้ำตาล: ค้นหา Lot, จ่ายออกน้ำตาล, ออกใบ COA">
  <meta name="theme-color" content="#1e90ff">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QC Time">

  <style>
/* ====================================================================
   QC Time · single-file app
   1. tokens & base   2. landing   3. app shell   4. document sheet
   5. page styles (find-lot / release / coa / settings)
   ==================================================================== */

/* ---------- 1. tokens & base ---------- */
:root {
  --ink: #0f2a4a; --ink-2: #4a6280; --ink-3: #8aa0b8;
  --paper: #fffdf8; --paper-2: #f4f7fb; --line: #dbe4ee;
  --sky: #1e90ff; --sky-deep: #0f6fd6; --sky-soft: #e4f1ff;
  --leaf: #2ec24a; --leaf-deep: #1c9a36; --leaf-soft: #e3f8e7;
  --mango: #ff9f1c; --mango-deep: #e8850a; --mango-soft: #fff1dc;
  --kraft: #e9c79a; --kraft-deep: #c99a5b;
  --ok: #21b34a; --warn: #f5a300; --bad: #e5484d;
  --accent: var(--sky); --accent-deep: var(--sky-deep); --accent-soft: var(--sky-soft);
  --r-panel: 26px; --r-card: 18px; --r-input: 14px;
  --shadow-panel: 0 24px 60px rgba(0,35,80,.28);
  --shadow-card: 0 6px 18px rgba(0,35,80,.10);
  --bar-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Mitr", "Prompt", "Segoe UI", Tahoma, sans-serif;
  color: var(--ink);
  background: #79c1f2 url("assets/bg.jpg") center / cover no-repeat fixed;
  min-height: 100vh; min-height: 100dvh;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; }
body.is-landing::before { background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.10), rgba(255,255,255,0) 55%); }
body.is-app::before { background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,30,70,.18)); }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 6px; }
.hide { display: none !important; }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.mt { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Toast (shared) */
.toast {
  position: fixed; left: 50%; bottom: 40px; z-index: 30;
  transform: translate(-50%, 16px); opacity: 0;
  padding: 12px 20px; border-radius: 14px;
  background: rgba(15,42,74,.94); color: #fff;
  font-size: 15px; max-width: 90vw; text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
  pointer-events: none; transition: transform .3s, opacity .3s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast b { color: #ffd166; font-weight: 500; }

/* ---------- 2. landing ---------- */
.landing {
  --logo-w: clamp(240px, 42vw, 620px);
  --tile-w: clamp(120px, 22vw, 300px);
  --mascot-w: clamp(110px, 20vw, 300px);
  --gap: clamp(10px, 2vw, 28px);
  position: relative;
  min-height: 100vh; min-height: 100dvh;
  display: grid; grid-template-rows: auto 1fr auto;
  align-items: center; justify-items: center;
  padding: clamp(16px, 3vh, 40px) clamp(12px, 3vw, 40px) clamp(20px, 4vh, 48px);
}
.landing .brand {
  position: absolute; top: clamp(10px, 2vh, 22px); left: clamp(10px, 2vw, 26px);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px 7px 10px; border-radius: 999px;
  background: rgba(255,255,255,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 4px 16px rgba(0,50,100,.18);
  color: #1f7a3a; font-weight: 500; font-size: clamp(12px, 1.4vw, 17px); white-space: nowrap; z-index: 5;
}
.landing .brand svg { width: 1.35em; height: 1.35em; flex: none; }
.landing .top-actions .user-chip { height: clamp(38px, 4.4vw, 52px); padding: 4px 16px 4px 5px; border-radius: 999px; background: rgba(255,255,255,.86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 4px 16px rgba(0,50,100,.2); color: var(--ink); font-size: clamp(13px, 1.3vw, 16px); font-weight: 500; max-width: 46vw; }
.landing .top-actions .user-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.landing .top-actions .user-chip .avatar { width: calc(clamp(38px, 4.4vw, 52px) - 8px); height: calc(clamp(38px, 4.4vw, 52px) - 8px); background: var(--sky-deep); font-size: clamp(13px, 1.3vw, 17px); }
.landing .top-actions { position: absolute; top: clamp(10px, 2vh, 22px); right: clamp(10px, 2vw, 26px); display: flex; gap: clamp(8px, 1vw, 12px); z-index: 5; }
.landing .gear {
  border: 0; padding: 0; font: inherit; text-decoration: none;
  width: clamp(38px, 4.4vw, 52px); height: clamp(38px, 4.4vw, 52px);
  display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
  background: rgba(255,255,255,.86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 4px 16px rgba(0,50,100,.20); color: var(--sky-deep); z-index: 5;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), background .2s;
}
.landing .gear svg { width: 58%; height: 58%; transition: transform .6s; }
.landing .gear:hover { transform: scale(1.1); background: #fff; }
.landing .gear:hover svg { transform: rotate(90deg); }
.landing .gear:active { transform: scale(.94); }
.landing .gear.logout svg { width: 56%; height: 56%; }
.landing .gear.logout:hover svg { transform: translateX(8%); }
.landing .logo {
  width: var(--logo-w); max-width: 92vw; margin-top: clamp(6px, 3vh, 30px);
  filter: drop-shadow(0 10px 22px rgba(0,40,90,.30));
  animation: float-logo 3.8s ease-in-out infinite; user-select: none;
}
.landing .logo img { display: block; width: 100%; height: auto; -webkit-user-drag: none; }
@keyframes float-logo { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-12px) rotate(.6deg); } }
.landing .menu {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: var(--gap); width: 100%; max-width: 1100px; margin: clamp(8px, 3vh, 36px) 0; padding: 0; list-style: none;
}
.landing .menu li { animation: pop-in .6s cubic-bezier(.34,1.56,.64,1) both; }
.landing .menu li:nth-child(1) { animation-delay: .15s; }
.landing .menu li:nth-child(2) { animation-delay: .30s; }
.landing .menu li:nth-child(3) { animation-delay: .45s; }
@keyframes pop-in { from { opacity: 0; transform: translateY(30px) scale(.85); } to { opacity: 1; transform: none; } }
.landing .tile {
  display: block; width: var(--tile-w); border-radius: 18%;
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s;
  filter: drop-shadow(0 12px 18px rgba(0,40,90,.35)); user-select: none;
}
.landing .tile img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
.landing .tile-txt { display: none; }
.landing .tile:hover, .landing .tile:focus-visible { transform: translateY(-8px) scale(1.06); filter: drop-shadow(0 20px 26px rgba(0,40,90,.42)) brightness(1.05); }
.landing .tile:active { transform: translateY(2px) scale(.96); transition-duration: .08s; }
.landing .tile.locked { opacity: .5; filter: grayscale(.7); cursor: not-allowed; position: relative; }
.landing .tile.locked::after { content: "🔒"; position: absolute; right: 8px; top: 8px; font-size: 18px; filter: none; }
.landing .mascot {
  position: absolute; left: clamp(4px, 2vw, 40px); bottom: clamp(4px, 2vh, 28px);
  width: var(--mascot-w); filter: drop-shadow(0 12px 18px rgba(0,40,90,.35));
  transform-origin: 50% 100%; animation: float-mascot 3.2s ease-in-out infinite; pointer-events: none; z-index: 2;
}
.landing .mascot img { display: block; width: 100%; height: auto; }
@keyframes float-mascot { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
.landing .foot {
  align-self: end; font-size: clamp(11px, 1.2vw, 14px); color: rgba(255,255,255,.95);
  text-shadow: 0 1px 4px rgba(0,30,70,.6); text-align: center;
  padding: 0 calc(var(--mascot-w) * .6);
}
@media (max-width: 640px) {
  .landing { --logo-w: 78vw; --tile-w: min(42vw, 17vh); --mascot-w: 24vw; --gap: 2vh; }
  .landing .logo { margin-top: clamp(40px, 8vh, 84px); } /* clear the top-corner buttons on phones */
  .landing nav { align-self: center; padding-top: 0; }
  .landing .menu { margin: 0; flex-direction: column; flex-wrap: nowrap; align-items: stretch; max-width: 420px; } /* phones: menu buttons stacked vertically */
  .landing { --tile-w: min(27vw, 14vh); }
  .landing .menu li { width: 100%; }
  .landing .tile { display: flex; align-items: center; gap: 12px; width: 100%; border-radius: 22px; text-decoration: none; filter: none; }
  .landing .tile img { width: var(--tile-w); flex: none; border-radius: 18%; filter: drop-shadow(0 10px 14px rgba(0,40,90,.35)); }
  .landing .tile-txt { display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 0; position: relative; padding: 12px 40px 12px 16px; border-radius: 20px; background: rgba(255,255,255,.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 10px 26px rgba(0,40,90,.22); border-left: 6px solid var(--sky); color: var(--ink); text-align: left; }
  .landing .tile.leaf .tile-txt { border-left-color: var(--leaf); } .landing .tile.mango .tile-txt { border-left-color: var(--mango); }
  .landing .tile-txt b { font-size: 18px; font-weight: 600; line-height: 1.2; }
  .landing .tile-txt small { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
  .landing .tile-txt i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 20px; line-height: 1; color: #fff; background: var(--sky); }
  .landing .tile.leaf .tile-txt i { background: var(--leaf); } .landing .tile.mango .tile-txt i { background: var(--mango); }
  .landing .tile:hover, .landing .tile:focus-visible { transform: none; filter: none; }
  .landing .tile:active { transform: scale(.98); }
  .landing .brand { font-size: 12px; padding: 5px 10px 5px 8px; }
  .landing .gear { width: 38px; height: 38px; }
  .landing .mascot { left: 6px; bottom: 6px; }
  .landing .foot { padding: 0 0 0 calc(var(--mascot-w) + 8px); text-align: right; }
}

/* ---------- 2b. login (painted frame + real inputs on top) ---------- */
/* Sized from the viewport height as well as width so the whole page fits one screen */
.landing.login { grid-template-rows: auto 1fr auto; --logo-w: clamp(220px, min(46vw, 60vh), 660px); padding-top: 1.5vh; padding-bottom: 1.5vh; }
.landing.login .logo { margin-top: 0.5vh; }
.landing.login .foot { padding-top: 1vh; }
.login-wrap { display: flex; flex-direction: column; align-items: center; gap: 1vh; animation: pop-in .6s cubic-bezier(.34,1.56,.64,1) both .15s; }
.login-box {
  position: relative; width: clamp(280px, min(52vw, 69vh), 720px); max-width: 92vw;
  aspect-ratio: 1000 / 946; container-type: inline-size;
  filter: drop-shadow(0 18px 30px rgba(0,40,90,.38));
}
.login-box > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; -webkit-user-drag: none; user-select: none; }
.login-box form { position: absolute; inset: 0; }
.lf-input {
  position: absolute; left: 11%; width: 78%; display: flex; align-items: center; gap: 2.5cqw;
  padding: 0 3cqw 0 4cqw; border: 0.35cqw solid #c5d3e8; border-radius: 3cqw;
  background: #eef4ff; color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.lf-input:focus-within { border-color: var(--sky); box-shadow: 0 0 0 .8cqw rgba(30,144,255,.18); background: #f6f9ff; }
.lf-user { top: 27.6%; height: 13.2%; }
.lf-pass { top: 44.2%; height: 13.2%; }
.lf-input svg { width: 5.2cqw; height: 5.2cqw; color: #5b6b82; flex: none; }
.lf-input input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 4.3cqw; font-family: inherit; color: var(--ink); }
.lf-input input::placeholder { color: #8a98ad; font-weight: 300; }
.lf-input .eye { width: 9cqw; height: 100%; flex: none; border: 0; border-left: 0.25cqw solid #c5d3e8; background: transparent; color: #5b6b82; display: inline-flex; align-items: center; justify-content: center; padding: 0 0 0 2cqw; }
.lf-input .eye svg { width: 5cqw; height: 5cqw; }
.lf-input.shake { animation: shake .4s; border-color: var(--bad); }
@keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-1.2cqw);} 75% { transform: translateX(1.2cqw);} }
.lf-remember { position: absolute; left: 9%; top: 59.6%; width: 34%; height: 7%; border: 0; background: transparent; padding: 0; cursor: pointer; }
.lf-remember .box { position: absolute; left: 0; top: 0; width: 6cqw; height: 6.2cqw; border-radius: 1.2cqw; background: #fff; border: 0.4cqw solid #1a73e8; opacity: 0; transition: opacity .1s; }
.lf-remember[aria-pressed="false"] .box { opacity: 1; }
.lf-forgot { position: absolute; left: 62%; top: 60.8%; width: 29%; height: 4.8%; border: 0; background: transparent; cursor: pointer; }
.lf-submit { position: absolute; left: 8%; top: 70%; width: 84%; height: 19.2%; border: 0; border-radius: 3.5cqw; background: transparent; cursor: pointer; transition: transform .12s, background .12s; }
.lf-submit:hover { background: rgba(255,255,255,.10); }
.lf-submit:active { transform: translateY(1%) scale(.985); background: rgba(0,0,0,.08); }
.lf-submit:focus-visible { outline: 0.5cqw solid #fff; outline-offset: -1cqw; }
.lf-submit .txt {
  position: absolute; left: 40%; width: 36%; top: 8%; height: 84%;
  display: flex; align-items: center; justify-content: center;
  font-size: 6.4cqw; font-weight: 600; line-height: 1; color: #fff; white-space: nowrap;
  letter-spacing: .02em; padding-bottom: 0.6cqw;
  paint-order: stroke fill; -webkit-text-stroke: 0.7cqw #1a8a30;
  text-shadow: 0 0.45cqw 0 #15772a, 0 0.9cqw 1.2cqw rgba(0,60,20,.35);
}
/* loading state: longer text ("กำลังตรวจสอบ…") — shrink font so it keeps the same footprint as "เข้าสู่ระบบ" and stays clear of the icon/leaf graphics */
.lf-submit.busy .txt { font-size: 4.5cqw; -webkit-text-stroke-width: 0.55cqw; }
.login-hint { font-size: clamp(12px, 1.2vw, 14px); color: rgba(255,255,255,.95); text-shadow: 0 1px 4px rgba(0,30,70,.6); text-align: center; line-height: 1.5; }
.login-hint code { font-family: inherit; background: rgba(15,42,74,.55); padding: 1px 8px; border-radius: 8px; }
@media (max-width: 640px) {
  .login-box { width: min(88vw, 60vh); }
  .landing.login nav { padding-top: 0; }
  /* clear the phone status-bar / notch: push top badge, buttons and logo down */
  .landing .brand, .landing .top-actions { top: calc(18px + env(safe-area-inset-top)); }
  .landing.login { padding-top: calc(64px + env(safe-area-inset-top)); }
  .landing.login .logo { margin-top: 2vh; }
}

/* ---------- 3. app shell ---------- */
.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; height: var(--bar-h); padding: 10px clamp(12px, 3vw, 28px); }
.bar-inner {
  flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; height: 100%; padding: 0 8px 0 6px; border-radius: 999px;
  background: rgba(255,255,255,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 22px rgba(0,40,90,.18);
}
.icon-btn {
  width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--ink); text-decoration: none;
  transition: background .15s, transform .2s cubic-bezier(.34,1.56,.64,1);
}
.icon-btn:hover { background: var(--paper-2); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 22px; height: 22px; transition: transform .25s; }
.icon-btn.logout { background: var(--sky-soft); color: var(--sky-deep); }
.icon-btn.logout:hover { background: #d3e8ff; color: var(--sky-deep); }
.icon-btn.logout:hover svg { transform: translateX(2px); }
.bar-left { display: flex; justify-content: flex-start; min-width: 0; }
.bar-right { display: flex; justify-content: flex-end; align-items: center; gap: 6px; min-width: 0; }
.back-btn {
  display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 16px 0 10px;
  border-radius: 999px; background: var(--sky-soft); color: var(--sky-deep);
  font-size: 15px; font-weight: 500; text-decoration: none; white-space: nowrap;
  transition: background .15s, transform .2s cubic-bezier(.34,1.56,.64,1);
}
.back-btn svg { width: 20px; height: 20px; transition: transform .2s; }
.back-btn:hover { background: #d3e8ff; }
.back-btn:hover svg { transform: translateX(-3px); }
.back-btn:active { transform: scale(.95); }
.bar-title { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; text-align: left; }
.bar-inner.has-tabs { grid-template-columns: auto auto 1fr auto; }
.bar-inner.has-tabs .bar-title { justify-content: flex-start; }
.bar-tabs { display: flex; justify-content: center; min-width: 0; }
.bar .fl-tabs { margin: 0; box-shadow: none; background: var(--paper-2); padding: 3px; backdrop-filter: none; -webkit-backdrop-filter: none; }
.bar .fl-tabs .tab { padding: 7px 16px; font-size: 14px; }
@media (max-width: 900px) { .bar-inner.has-tabs .bar-title small { display: none; } .bar .fl-tabs .tab { padding: 6px 10px; font-size: 13px; } }
.bar-title img { width: 38px; height: 38px; border-radius: 10px; flex: none; }
.bar-title h1 { font-size: 19px; font-weight: 500; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-title small { display: block; font-size: 12px; color: var(--ink-2); }
.user-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--paper-2); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.user-chip .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; overflow: hidden; flex: none; }
.user-chip .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
@media (max-width: 640px) {
  .user-chip span:last-child { display: none; } .user-chip { padding-right: 4px; }
  .bar-inner { grid-template-columns: auto 1fr auto; }
  .back-btn { padding: 0 12px 0 8px; font-size: 14px; }
  .bar-title small { display: none; }
  .bar-title h1 { font-size: 17px; }
}

.page.wide { width: min(1400px, 100%); }
.page { position: relative; width: min(1100px, 100%); margin: 0 auto; padding: 6px clamp(12px, 3vw, 28px) 60px; }
.panel {
  position: relative; background: rgba(255,253,248,.94);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: var(--r-panel); box-shadow: var(--shadow-panel); overflow: hidden;
}
.panel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--accent); }
.panel-body { padding: clamp(18px, 3vw, 30px) clamp(18px, 3.4vw, 34px) clamp(20px, 3vw, 32px) calc(clamp(18px, 3.4vw, 34px) + 6px); }
.section-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 22px 0 12px; }
.section-title:first-child { margin-top: 0; }
.section-title h2 { font-size: 17px; font-weight: 500; }
.section-title .hint { font-size: 12.5px; color: var(--ink-2); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; color: var(--ink-2); }
.field .req::after { content: " *"; color: var(--bad); }
.input, .select, .textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: var(--r-input); background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }

/* desktop: larger, easier-to-click buttons */

.doc-check li.on { color: #142238; }
.doc-check li.on::before { border-color: var(--ok); background: var(--ok) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='m5 12 5 5L20 7'/></svg>") center / 11px no-repeat; }
.stamp {
  position: absolute; right: clamp(14px, 5%, 48px); bottom: clamp(28px, 7%, 70px);
  width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--ok); color: var(--ok);

/* ---------- 4y. phone view (desktop preview of the mobile app) ---------- */

/* ---------- 4z. mobile app layout (phones & tablet portrait ≤ 860px): compact top bar, tabs become a bottom navigation bar ---------- */

}
/* ---------- 5a. find lot (live data from the Quality sheet) ---------- */
.fl-layout { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }

// Ask the Apps Script to verify a login against the Users sheet; null = server not available / not updated -> use local list
async function serverLogin(u, p) {
  const url = (getSettings().api || "").trim() || API_DEFAULT; if (!url) return null;
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "login", user: u, pass: p }) });
    const j = await res.json();
    if (j.ok) return { ok: true, user: j.user };
    if (/unknown action/i.test(j.error || "")) return null;
    return { ok: false, error: j.error || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง" };
  } catch (e) { return null; }
}

}

const PAGE_DENY = { "คลังสินค้า": ["release", "coa"], "QC": ["coa"], "ฝ่ายขาย": ["release"] };
const canOpen = name => !(PAGE_DENY[(getUser().role || "")] || []).includes(name);
function route() {
  const hash = location.hash.slice(1) || "/";
  const [path, qs] = hash.split("?");
  const name = path.replace(/^\//, "") || "home";
  const params = new URLSearchParams(qs || "");
  // Auth guard: everything except the login page needs a session
  if (name !== "login" && !getSession()) { location.replace("#/login"); return; }
  if (name === "login" && getSession()) { location.replace("#/"); return; }
  if (name !== "home" && name !== "login" && views[name] && !canOpen(name)) { toast("บัญชีนี้ไม่มีสิทธิ์เข้าเมนูนี้"); location.replace("#/"); return; }
  const v = views[name] || views.home;
  document.body.className = (name === "home" || name === "login") ? "is-landing" : "is-app"; document.body.dataset.view = name; document.body.classList.toggle("has-tabs", !!v.tabs);
  // per-view @page rule (paper size / orientation for printing)
  document.getElementById("pgStyle")?.remove(); if (v.pageCss) { const ps = document.createElement("style"); ps.id = "pgStyle"; ps.textContent = v.pageCss; document.head.appendChild(ps); }
  document.documentElement.style.setProperty("--accent", `var(--${v.accent || "sky"})`);
  document.documentElement.style.setProperty("--accent-deep", `var(--${v.accent || "sky"}-deep)`);
  document.documentElement.style.setProperty("--accent-soft", `var(--${v.accent || "sky"}-soft)`);
  document.querySelectorAll("body > .bar-tabs").forEach(e => e.remove());
  app.innerHTML = (v.bar ? barHtml(v) : "") + v.html(params);
  if (v.tabs && MOBILE_MQ.matches) { const t = app.querySelector(".bar-tabs"); if (t) { t.classList.add("bottom-nav"); document.body.appendChild(t); } }
  document.title = v.title ? `${v.title} · QC Time` : "QC Time · Mitr Lao Sugar";
  window.scrollTo(0, 0);
  const bl = app.querySelector("#barLogout"); if (bl) bl.addEventListener("click", logout);
  v.init(app.querySelector(".page, .landing"), params);
}
window.addEventListener("hashchange", route);

const GRADE_COLOR = { DCR: "#1e90ff", VHP: "#ff9f1c", Organic: "#2ec24a" };
const GRADES = ["DCR", "VHP", "Organic"];
const STATUS_COLOR = { "ผ่าน": "#21b34a", "เฝ้าระวัง": "#f5a300", "ไม่ผ่าน": "#e5484d" };
const TH_MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const dkDate = dk => new Date(+dk.slice(0, 4), +dk.slice(4, 6) - 1, +dk.slice(6, 8));
const dkShort = dk => `${+dk.slice(6, 8)} ${TH_MON[+dk.slice(4, 6) - 1]}`;
const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
const vals = (rows, k) => rows.map(r => r[k]).filter(v => v !== null && v !== undefined);
const niceTicks = (min, max, n = 5) => {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  const step = (m >= 5 ? 10 : m >= 2 ? 5 : m >= 1 ? 2 : 1) * p;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step; const t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(6));
  return { lo, hi, ticks: t };
};
const fmtV = (v, d) => v === null || v === undefined ? "—" : d === 0 ? fmtInt(Math.round(v)) : fmt(v, d);

/* Small SVG chart kit: line (crosshair tooltip), stacked bars, horizontal bars, donut */
const CH = {
  tip(el) { let t = el.querySelector(".ch-tip"); if (!t) { t = document.createElement("div"); t.className = "ch-tip"; el.appendChild(t); } return t; },
  line(el, { labels, series, decimals = 0, unit = "" }) {
    const W = 640, H = 230, L = 46, R = 14, T = 14, B = 30, w = W - L - R, h = H - T - B;
    const all = series.flatMap(s => s.values.filter(v => v !== null)); if (!all.length) { el.innerHTML = `<div class="ch-empty">ไม่มีข้อมูล</div>`; return; }
    const { lo, hi, ticks } = niceTicks(Math.min(...all), Math.max(...all));
    const x = i => L + (labels.length > 1 ? i * w / (labels.length - 1) : w / 2), y = v => T + h - (v - lo) / (hi - lo) * h;
    const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${L - 6}" y="${y(t) + 4}" class="tick" text-anchor="end">${fmtV(t, decimals)}</text>`).join("");
    const every = Math.max(1, Math.ceil(labels.length / 8));
    const xl = labels.map((lb, i) => i % every === 0 || i === labels.length - 1 ? `<text x="${x(i)}" y="${H - 8}" class="tick" text-anchor="middle">${dkShort(lb)}</text>` : "").join("");
    const paths = series.map(s => { let d = "", pen = false; s.values.forEach((v, i) => { if (v === null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; }); return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; }).join("");
    const ends = series.map(s => { let li = -1; s.values.forEach((v, i) => { if (v !== null) li = i; }); if (li < 0) return ""; return `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="3.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>${series.length > 1 ? `<text x="${x(li) - 6}" y="${y(s.values[li]) - 8}" class="dl" text-anchor="end" fill="${s.color}">${s.name}</text>` : ""}`; }).join("");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="ch">${grid}${xl}${paths}${ends}<g class="hover"></g><rect class="hit" x="${L}" y="${T}" width="${w}" height="${h}" fill="transparent"/></svg>${series.length > 1 ? `<div class="ch-legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>` : ""}`;
    const svg = el.querySelector("svg"), hov = svg.querySelector(".hover"), tip = CH.tip(el);
    svg.querySelector(".hit").addEventListener("mousemove", e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const i = Math.max(0, Math.min(labels.length - 1, Math.round((p.x - L) / (w / Math.max(1, labels.length - 1)))));
      hov.innerHTML = `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T + h}" class="xh"/>` + series.map(s => s.values[i] === null ? "" : `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join("");
      tip.innerHTML = `<b>${dkShort(labels[i])}</b>` + series.map(s => `<div><i style="background:${s.color}"></i>${s.name}: <b>${fmtV(s.values[i], decimals)}${unit}</b></div>`).join("");
      tip.style.display = "block"; const r = el.getBoundingClientRect(); const lx = e.clientX - r.left, ly = e.clientY - r.top;
      tip.style.left = Math.min(lx + 14, r.width - tip.offsetWidth - 6) + "px"; tip.style.top = Math.max(0, ly - tip.offsetHeight - 10) + "px";
    });
    svg.querySelector(".hit").addEventListener("mouseleave", () => { hov.innerHTML = ""; tip.style.display = "none"; });
  },
  bars(el, { labels, stacks, unit = "" }) {
    const W = 640, H = 230, L = 40, R = 14, T = 14, B = 30, w = W - L - R, h = H - T - B;
    const totals = labels.map((_, i) => stacks.reduce((s, st) => s + (st.values[i] || 0), 0));
    if (!labels.length) { el.innerHTML = `<div class="ch-empty">ไม่มีข้อมูล</div>`; return; }
    const { lo, hi, ticks } = niceTicks(0, Math.max(...totals, 1)); const y = v => T + h - (v - lo) / (hi - lo) * h;
    const bw = w / labels.length, bar = Math.max(4, Math.min(28, bw * .7));
    const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${L - 6}" y="${y(t) + 4}" class="tick" text-anchor="end">${fmtInt(t)}</text>`).join("");
    const every = Math.max(1, Math.ceil(labels.length / 8));
    const xl = labels.map((lb, i) => i % every === 0 ? `<text x="${L + bw * (i + .5)}" y="${H - 8}" class="tick" text-anchor="middle">${lb}</text>` : "").join("");
    const rects = labels.map((_, i) => { let acc = 0; return stacks.map(st => { const v = st.values[i] || 0; if (!v) return ""; const y1 = y(acc + v), y0 = y(acc); acc += v; return `<rect x="${L + bw * (i + .5) - bar / 2}" y="${y1}" width="${bar}" height="${Math.max(0, y0 - y1 - 1)}" fill="${st.color}" rx="2" data-i="${i}"/>`; }).join(""); }).join("");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="ch">${grid}${xl}${rects}</svg>${stacks.length > 1 ? `<div class="ch-legend">${stacks.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>` : ""}`;
    const tip = CH.tip(el);
    el.querySelectorAll("rect[data-i]").forEach(rc => { rc.addEventListener("mousemove", e => { const i = +rc.dataset.i; tip.innerHTML = `<b>${labels[i]}</b><div>รวม <b>${fmtInt(totals[i])}${unit}</b></div>` + stacks.map(s => s.values[i] ? `<div><i style="background:${s.color}"></i>${s.name}: <b>${fmtInt(s.values[i])}</b></div>` : "").join(""); tip.style.display = "block"; const r = el.getBoundingClientRect(); tip.style.left = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 6) + "px"; tip.style.top = Math.max(0, e.clientY - r.top - tip.offsetHeight - 10) + "px"; }); rc.addEventListener("mouseleave", () => tip.style.display = "none"); });
  },
  hbars(el, { rows, unit = "%" }) {
    if (!rows.length) { el.innerHTML = `<div class="ch-empty">ไม่มีข้อมูล</div>`; return; }
    el.innerHTML = `<div class="hb">${rows.map(r => `<div class="hb-row"><div class="hb-lbl"><b>${esc(r.label)}</b><small>${esc(r.sub || "")}</small></div><div class="hb-track"><div class="hb-fill" style="width:${Math.max(0, Math.min(100, r.pct))}%;background:${r.color}"></div></div><div class="hb-val">${fmt(r.pct, 0)}${unit}</div></div>`).join("")}</div>`;
  },
  donut(el, { parts }) {
    const total = parts.reduce((s, p) => s + p.value, 0); if (!total) { el.innerHTML = `<div class="ch-empty">ไม่มีข้อมูล</div>`; return; }
    const R = 60, C = 2 * Math.PI * R; let off = 0;
    const arcs = parts.filter(p => p.value).map(p => { const len = p.value / total * C; const s = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${Math.max(0, len - 2)} ${C - Math.max(0, len - 2) + 2}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return s; }).join("");
    el.innerHTML = `<div class="dn"><svg viewBox="0 0 160 160" class="dn-svg">${arcs}<text x="80" y="76" text-anchor="middle" class="dn-big">${fmt(parts[0].value / total * 100, 0)}%</text><text x="80" y="96" text-anchor="middle" class="dn-sm">${esc(parts[0].name)}</text></svg>
      <div class="dn-legend">${parts.map(p => `<div><i style="background:${p.color}"></i><span>${esc(p.name)}</span><b>${fmtInt(p.value)}</b><small>${fmt(p.value / total * 100, 1)}%</small></div>`).join("")}</div></div>`;
  },
};

function renderDashboard(root) {
  const $ = s => root.querySelector(s);
  if (!Q.rows) { $("#kpis").innerHTML = `<div class="d-empty" style="grid-column:1/-1"><img src="assets/mascot.png" alt=""><b>${Q.error ? "โหลดข้อมูลไม่ได้" : "กำลังโหลดข้อมูลจาก Google Sheets…"}</b></div>`; return; }
  const g = chipValue($("#dGrade")), m = $("#dMonth").value;
  const rows = Q.rows.filter(r => r.dk && (!g || r.grade === g) && (!m || r.dk.slice(0, 6) === m));
  const base = Q.rows.filter(r => r.dk && (!m || r.dk.slice(0, 6) === m));
  const seasonRows = Q.rows.filter(r => r.season); const season = seasonRows.length ? seasonRows[0].season.replace(" ", "/") : "";
  $("#dashSub").textContent = `ฤดูผลิต ${season} · ${g || "ทุกเกรด"} · ${m ? TH_MON[+m.slice(4, 6) - 1] + " " + m.slice(0, 4) : "ทั้งฤดู"} · ข้อมูล ${fmtInt(Q.rows.length)} Lot จาก Google Sheets อัปเดต ${new Date(Q.at).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" })}`;

  // KPIs
  const n = rows.length, pass = rows.filter(r => r.status === "ผ่าน").length, watch = rows.filter(r => r.status === "เฝ้าระวัง").length, fail = rows.filter(r => r.status === "ไม่ผ่าน").length;
  const kpi = (v, lbl, sub, cls = "") => `<div class="kpi ${cls}"><b>${v}</b><span>${lbl}</span>${sub ? `<small>${sub}</small>` : ""}</div>`;
  $("#kpis").innerHTML = kpi(fmtInt(n), "Lot ทั้งหมด", m ? "ในเดือนที่เลือก" : "ทั้งฤดู") + kpi(n ? fmt(pass / n * 100, 1) + "%" : "—", "ผ่าน Spec", `${fmtInt(pass)} Lot`, "ok") +
    kpi(n ? fmt(watch / n * 100, 1) + "%" : "—", "เฝ้าระวัง", `${fmtInt(watch)} Lot`, "warn") + kpi(n ? fmt(fail / n * 100, 1) + "%" : "—", "ไม่ผ่าน", `${fmtInt(fail)} Lot`, "bad") +
    kpi(fmtV(avg(vals(rows, "color")), 0), "สีเฉลี่ย", "IU") + kpi(fmtV(avg(vals(rows, "pol")), 2), "Pol เฉลี่ย", "%") + kpi(fmtV(avg(vals(rows, "ma")), 2), "M.A. เฉลี่ย", "mm") + kpi(fmtV(avg(vals(rows, "moist")), 2), "ความชื้นเฉลี่ย", "%");

  // Daily trend series: one line per grade when "all", else one line

  // Weekly production (Monday-based weeks)
  const wk = {}; rows.forEach(r => { const d = dkDate(r.dk); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); const k = d.toISOString().slice(0, 10); wk[k] = wk[k] || { DCR: 0, VHP: 0, Organic: 0, other: 0 }; wk[k][GRADES.includes(r.grade) ? r.grade : "other"]++; });
  const wkeys = Object.keys(wk).sort();
  CH.bars($("#chWeek"), { labels: wkeys.map(k => `${+k.slice(8, 10)} ${TH_MON[+k.slice(5, 7) - 1]}`), stacks: (g ? [g] : GRADES).map(gr => ({ name: gr, color: GRADE_COLOR[gr], values: wkeys.map(k => wk[k][gr]) })), unit: " Lot" });

  // Status donut
  CH.donut($("#chStatus"), { parts: [{ name: "ผ่าน", value: pass, color: STATUS_COLOR["ผ่าน"] }, { name: "เฝ้าระวัง", value: watch, color: STATUS_COLOR["เฝ้าระวัง"] }, { name: "ไม่ผ่าน", value: fail, color: STATUS_COLOR["ไม่ผ่าน"] }] });

  // Customer spec performance: % of same-grade lots (in the period) passing each spec
  const crow = (Q.specs || []).filter(s => GRADES.includes(s.grade) && (!g || s.grade === g)).map(s => { const pool = base.filter(r => r.grade === s.grade); const ok = pool.filter(r => checkSpec(r, s).ok).length; return { label: s.name, sub: `${s.product} · ผ่าน ${fmtInt(ok)} จาก ${fmtInt(pool.length)} Lot`, pct: pool.length ? ok / pool.length * 100 : 0, color: GRADE_COLOR[s.grade] }; }).sort((a, b) => b.pct - a.pct);
  CH.hbars($("#chCust"), { rows: crow });

const SHEET_HEADERS = { strike: "Lot (Strike)", grade: "เกรด", date: "วันผลิต", bb: "Best before", color: "สี Color (ICU)", pol: "Pol (%)", moist: "ความชื้น (%)", invert: "อินเวิร์ต (%)", ma: "M.A. (mm)", ash: "Conductivity Ash", sed: "Sediment", status: "สถานะ Spec", loc: "ตำแหน่งเก็บ", stock: "คงเหลือ (ตัน)", bags: "จำนวนกระสอบ", customer: "ลูกค้า", cert: "Cert No.", season: "แผ่นที่มา", by: "ผู้บันทึกล่าสุด", edited: "เวลาแก้ไข" };
const getEdits = () => JSON.parse(localStorage.getItem("qc.edits") || "{}");
const setEdits = e => localStorage.setItem("qc.edits", JSON.stringify(e));
const pendingCount = () => Object.keys(getEdits()).length;
// Overlay local (not yet synced) edits on top of the sheet rows
function applyEdits() {
  if (!Q.rows) return; const edits = getEdits();
  Q.rows = Q.rows.filter(r => !r.pending);
  Object.values(edits).forEach(e => { const i = Q.rows.findIndex(r => r.strike === e.row.strike); const row = { ...e.row, pending: true }; if (i >= 0) Q.rows[i] = row; else Q.rows.push(row); });
}
const nowText = () => { const d = new Date(); const p = n => String(n).padStart(2, "0"); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const toIso = d => { const m = String(d || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : ""; };
const fromIso = v => v ? `${v.slice(8, 10)}/${v.slice(5, 7)}/${v.slice(0, 4)}` : "";
function toSheetRow(r) {
  const o = {}; for (const k in SHEET_HEADERS) { let v = r[k]; if (v === null || v === undefined) v = ""; if (k === "date" || k === "edited") v = v ? "'" + v : ""; if (k === "strike") v = r.strikeN ?? v; o[SHEET_HEADERS[k]] = v; }
  return o;
}
async function postApi(payload) {
  const url = apiUrl();
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  if (!res.ok) throw new Error("HTTP " + res.status); const j = await res.json(); if (!j.ok) throw new Error(j.error || "บันทึกไม่สำเร็จ"); return j;
}
async function syncEdits(onDone) {
  const edits = getEdits(); const keys = Object.keys(edits); if (!keys.length) return { done: 0, failed: 0 };
  let done = 0, failed = 0, lastErr = "";
  for (const k of keys) { try { await postApi({ action: "upsertLot", row: toSheetRow(edits[k].row) }); delete edits[k]; setEdits(edits); done++; } catch (e) { failed++; lastErr = e.message; } }
  if (done) { await loadQuality(true); }
  if (onDone) onDone({ done, failed, lastErr });
  return { done, failed, lastErr };
}

const currentSeason = () => { const y = new Date().getFullYear(); const p = n => String(n % 100).padStart(2, "0"); return `${p(y - 1)} ${p(y)}`; };
function dpNewDraft() {
  const u = getUser(); const recs = dpRecs();
  return { id: recs.reduce((m, r) => Math.max(m, +r.id || 0), 0) + 1, uid: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),

}
function dpLog(rec, action, note) { const u = getUser(); (rec.log = rec.log || []).push({ ts: new Date().toISOString(), action, by: u.name, note: note || "" }); }
function dpUpsert(rec) { const recs = dpRecs(); const i = recs.findIndex(r => r.uid === rec.uid); if (i >= 0) recs[i] = rec; else recs.push(rec); dpSave(recs); }
function dpSlim(rec) { const r = { ...rec }; delete r.photos; return r; }
function dpPush(rec) { dpQueuePush({ action: "saveDispatch", record: dpSlim(rec) }); dpFlush(); }
let dpFlushing = false;
async function dpFlush() {
  if (dpFlushing || !navigator.onLine) return; const url = apiUrl(); if (!url) return;
  dpFlushing = true;
  try {
    // re-read the queue from storage each step so items appended during a POST (เช่น รูปที่ต่อท้ายหลัง saveDispatch) ไม่ถูกเขียนทับหาย
    while (true) {
      const q = dpQueue(); if (!q.length) break;
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(q[0]) }).then(r => r.json());

async function dpRefresh() {

    const delUids = new Set(dpQueue().filter(p => p.action === "deleteDispatch").map(p => p.uid));

  } catch (e) { return false; }
}

        <div class="fgrid mt">${field("Seal No. (ตู้คอนเทนเนอร์)", `<input class="input" id="w_seal" value="${esc(d.seal)}" placeholder="เช่น SL-88213">`, d.truckType === "รถตู้คอนเทนเนอร์ (Container)")}${field("เวลาขึ้นเสร็จ", `<input class="input" id="w_timeEnd" type="time" value="${esc(d.timeEnd)}">`, true)}</div>

    const gradeOfSugar = s => /VHP/i.test(s) ? "VHP" : /DCR/i.test(s) ? "DCR" : /Organic/i.test(s) ? "Organic" : /ขาว|White/i.test(s) ? "White" : "";
    function lotOptions(selected) { // เลือกได้เฉพาะ Lot ที่ผ่านและมีในชีต Quality เท่านั้น (กรองตามชนิดน้ำตาลที่เลือก)

    function validateStep() {
      const d = draft;

      if (step === 1) { const miss = DP.CHECKS.filter(c => !d.checks[c.id]); if (miss.length) return `ยังไม่ได้ตรวจ: ${miss[0].name} (เหลือ ${miss.length} รายการ)`; if (!(d.photos || []).length) return "กรุณาแนบรูปสภาพรถอย่างน้อย 1 รูป"; }
      if (step === 2) { if (!d.sugarType) return "กรุณาเลือกชนิดน้ำตาล"; if (!d.pack) return "กรุณาเลือกขนาดบรรจุ"; if (!d.bay) return "กรุณาเลือกคลังที่ขึ้นน้ำตาล"; if (!d.lots.length) return "กรุณาเพิ่มอย่างน้อย 1 Lot"; const bad = d.lots.findIndex(l => !l.no || !(+l.bags > 0)); if (bad >= 0) return `Lot ที่ ${bad + 1} ยังไม่ครบ (เลือก Lot / จำนวนกระสอบ)`; const notInDb = d.lots.findIndex(l => !(Q.rows || []).some(r => r.strike === String(l.no) && r.status === "ผ่าน")); if (notInDb >= 0) return `Lot ที่ ${notInDb + 1} (${esc(d.lots[notInDb].no)}) ไม่มีในฐานข้อมูลหรือไม่ผ่าน จ่ายออกไม่ได้`; if (!(dpTons(d) > 0)) return "จำนวนบรรทุกต้องมากกว่า 0 ตัน"; }

    function bindMain() {

  },

/* ---------- 3d. coa · Certificate of Analysis (form ML-FM-1610-037 Rev.06) · one record: marketing fills part 1 and saves, QC opens the same record and fills part 2 ---------- */
const COA_KEY = { recs: "qc.coa", queue: "qc.coa.queue" };
const coaRecs = () => JSON.parse(localStorage.getItem(COA_KEY.recs) || "[]");
const coaSave = recs => localStorage.setItem(COA_KEY.recs, JSON.stringify(recs));
const COA_COLS = [["color", "Color", "IU"], ["pol", "Polarization", "%"], ["moist", "Moisture", "%"], ["invert", "Invert Sugar", "%"], ["ma", "Target M.A.", "mm"], ["ash", "Conductivity Ash", "%"], ["sed", "Sediment", "ppm"]];
const COA_METHOD = { color: "ICUMSA GS2/3-10", pol: "ICUMSA GS2/3-1", moist: "ICUMSA GS2/1/3/9-15", invert: "ICUMSA GS2/3/9-5", ma: "ICUMSA GS2/9-37", ash: "ICUMSA GS2/3/9-17", sed: "ICUMSA GS2/3-19" };
const COA_STATUS = { new: ["ยังไม่บันทึก", "info"], request: ["รอ QA กรอกผล", "wait"], wait_approve: ["รออนุมัติ", "wait"], issued: ["อนุมัติแล้ว", "ok"], cancelled: ["ยกเลิก", "hold"] };
const coaVal = (lot, k) => lot[k] === null || lot[k] === undefined ? "" : (k === "color" || k === "sed") ? fmtInt(lot[k]) : k === "invert" || k === "ash" ? fmt(lot[k], 4) : fmt(lot[k], 2);
// เลข Lot/Strike ที่ "จ่ายออกแล้ว" (มีในบันทึกการจ่ายออกที่ไม่ใช่ร่าง) — ออก COA ได้เฉพาะลอตเหล่านี้
const dispatchedSet = () => { const s = new Set(); (typeof dpRecs === "function" ? dpRecs() : []).forEach(d => { if (d.status !== "draft") (d.lots || []).forEach(l => { if (l.no) s.add(String(l.no)); }); }); return s; };
// dd/mm/yyyy + n months (best-before default = production + 24 months)
const addMonthsDmy = (dmy, n) => { const m = String(dmy || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (!m) return ""; let y = +m[3]; if (y < 100) y += 2000; const d = new Date(y, +m[2] - 1 + n, +m[1]); return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`; };
// app roles -> COA roles: marketing (ฝ่ายขาย) writes part 1, QC/QA write part 2, admin does both
const coaRole = () => { const r = getUser().role || ""; return r === "ผู้ดูแลระบบ" ? "admin" : r === "ฝ่ายขาย" ? "sales" : r === "ผู้อนุมัติ" ? "approver" : "qc"; };
async function coaFlush() {
  const url = apiUrl(); if (!url || !navigator.onLine) return;
  // re-read the queue each step so items added during a POST are not overwritten
  while (true) { const q = JSON.parse(localStorage.getItem(COA_KEY.queue) || "[]"); if (!q.length) break; try { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(q[0]) }).then(x => x.json()); if (!r.ok) break; const q2 = JSON.parse(localStorage.getItem(COA_KEY.queue) || "[]"); q2.shift(); localStorage.setItem(COA_KEY.queue, JSON.stringify(q2)); } catch (e) { break; } }
}
async function coaRefresh() {
  const url = apiUrl(); if (!url || !navigator.onLine) return false;
  try { const j = await fetch(url + "?action=getCoa&_=" + Date.now()).then(r => r.json()); if (!j.ok) return false;
    const pending = new Set(JSON.parse(localStorage.getItem(COA_KEY.queue) || "[]").map(p => p.record.certNo)); const local = coaRecs();
    const merged = j.records.slice(); const have = new Map(merged.map((r, i) => [r.certNo, i]));
    local.forEach(r => { if (pending.has(r.certNo)) { if (have.has(r.certNo)) merged[have.get(r.certNo)] = r; else merged.push(r); } });
    coaSave(merged); return true; } catch (e) { return false; }
}
function coaPush(rec) { const recs = coaRecs(); const i = recs.findIndex(x => x.certNo === rec.certNo); if (i >= 0) recs[i] = rec; else recs.push(rec); coaSave(recs); const q = JSON.parse(localStorage.getItem(COA_KEY.queue) || "[]"); q.push({ action: "saveCoa", record: rec }); localStorage.setItem(COA_KEY.queue, JSON.stringify(q)); return coaFlush(); }

      localStorage.setItem("qc.user", JSON.stringify({ name: $("#name").value.trim() || "QC", role: $("#role").value }));
      if (before.sheetId !== o.sheetId || before.qualitySheet !== o.qualitySheet || before.specSheet !== o.specSheet) { localStorage.removeItem("qc.quality"); Q.rows = null; Q.specs = null; }
      const chip = app.querySelector(".user-chip"); if (chip) { chip.querySelector(".avatar").textContent = (o.name || $("#name").value.trim() || "Q").slice(0, 1); chip.querySelector("span:last-child").textContent = $("#name").value.trim() || "QC"; }
      refresh(); if (!quiet && Date.now() - lastToast > 1500) { toast("บันทึกแล้ว", 1200); lastToast = Date.now(); }
    }
    const autosave = () => { clearTimeout(timer); timer = setTimeout(() => save(false), 500); };
    root.querySelectorAll("input, select").forEach(el => { el.addEventListener("input", autosave); el.addEventListener("change", autosave); });
    root.addEventListener("change", e => { if (e.target.classList.contains("switch")) autosave(); });

    root.querySelectorAll(".set-nav a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); root.querySelectorAll(".set-nav a").forEach(x => x.classList.toggle("on", x === a)); $("#" + a.dataset.go).scrollIntoView({ behavior: "smooth", block: "start" }); }));
    const cards = [...root.querySelectorAll(".scard")];
    window.addEventListener("scroll", () => { let cur = cards[0]; cards.forEach(c => { if (c.getBoundingClientRect().top <= 120) cur = c; }); root.querySelectorAll(".set-nav a").forEach(x => x.classList.toggle("on", x.dataset.go === cur.id)); }, { passive: true });

    $("#testRead").addEventListener("click", async () => {
      save(true); $("#readStat").className = "conn"; $("#readText").textContent = "กำลังอ่านข้อมูล…";
      try { const t = await fetchSheet(sheetCfg().quality); const t2 = await fetchSheet(sheetCfg().spec); $("#readStat").className = "conn ok"; $("#readText").textContent = `อ่านได้ ${fmtInt(t.rows.length)} แถวใน ${sheetCfg().quality} และ ${fmtInt(t2.rows.length)} แถวใน ${sheetCfg().spec}`; }
      catch (e) { $("#readStat").className = "conn err"; $("#readText").textContent = "อ่านไม่ได้: " + e.message + " (ตรวจการแชร์ลิงก์และชื่อชีต)"; }
    });
    $("#clearCache").addEventListener("click", () => { localStorage.removeItem("qc.quality"); Q.rows = null; Q.specs = null; toast("<b>ล้างข้อมูลที่เก็บไว้แล้ว</b> จะโหลดใหม่เมื่อเปิดหน้าค้นหา"); refresh(); });
    $("#testApi").addEventListener("click", async () => {
      save(true); const url = $("#api").value.trim();
      if (!apiOk()) { $("#apiStat").className = "conn err"; $("#apiText").textContent = "URL ต้องขึ้นต้นด้วย https://script.google.com/macros/s/ และลงท้ายด้วย /exec"; return; }
      $("#apiStat").className = "conn"; $("#apiText").textContent = "กำลังทดสอบ…";
      try { const j = await fetch(url).then(r => r.json()); if (j.ok && j.service === "qc-time") { $("#apiStat").className = "conn ok"; $("#apiText").textContent = `เชื่อมต่อสำเร็จ · สคริปต์ QC Time · ชีต ${j.sheet}`; } else throw new Error("ไม่ใช่สคริปต์ QC Time"); }
      catch (e) { $("#apiStat").className = "conn err"; $("#apiText").textContent = "เชื่อมต่อไม่ได้: " + e.message + " (ตรวจว่า Deploy เป็น Web app แบบ Anyone แล้ว)"; }
    });
    $("#syncBtn").addEventListener("click", async () => { save(true); toast("กำลังซิงค์…"); const r = await syncEdits(); toast(r.failed ? `<b>ซิงค์ได้ ${r.done} ล้มเหลว ${r.failed}</b> ${esc(r.lastErr)}` : `<b>ซิงค์แล้ว ${r.done} รายการ</b>`, 3200); refresh(); });
    $("#pw").addEventListener("click", () => toast("<b>เปลี่ยนรหัสผ่าน</b> แก้ในชีต Users คอลัมน์ Password ได้เลย"));
    $("#seedUsers").addEventListener("click", async () => {
      save(true); if (!confirm(`สร้าง/อัปเดตผู้ใช้ ${USERS.length} คนในชีต Users ของสเปรดชีตนี้?`)) return; toast("กำลังส่งรายชื่อผู้ใช้…");
      try { const j = await postApi({ action: "seedUsers", users: USERS.map(u => ({ user: u.user, pass: u.pass, name: u.name, role: u.role })) }); toast(`<b>สร้างผู้ใช้ในชีตแล้ว</b> เพิ่ม ${j.added} คน อัปเดต ${j.updated} คน`, 3500); }
      catch (e) { toast(`<b>ทำไม่ได้</b> ${esc(e.message)} (ต้องอัปเดตโค้ดสคริปต์เป็นเวอร์ชันล่าสุดแล้ว Deploy → New version ก่อน)`, 5000); }
    });
    const clearSheetData = async (label, action, keys) => {
      if (!confirm(`ล้าง${label}ทั้งหมดออกจาก Google Sheet และในเครื่อง?\nการลบนี้ย้อนกลับไม่ได้`)) return;
      keys.forEach(k => localStorage.removeItem(k));
      if (!apiUrl()) { toast(`<b>ล้าง${label}ในเครื่องแล้ว</b> (ยังไม่เชื่อมชีต)`); return; }
      toast("กำลังล้าง…");
      try { const j = await postApi({ action }); toast(`<b>ล้าง${label}แล้ว</b> ลบจากชีต ${j.cleared || 0} รายการ`, 3200); }
      catch (e) { toast(`<b>ล้างในเครื่องแล้ว</b> แต่ลบจากชีตไม่ได้: ${esc(e.message || "")}`, 3600); }
    };
    $("#clearDpBtn").addEventListener("click", () => clearSheetData("บันทึกจ่ายออก", "clearDispatch", ["qc.dispatch", "qc.dispatch.queue", "qc.dispatch.draft"]));
    $("#clearCoaBtn").addEventListener("click", () => clearSheetData("ใบ COA", "clearCoa", ["qc.coa", "qc.coa.queue"]));
    $("#resetBtn").addEventListener("click", () => { localStorage.removeItem("qc.settings"); route(); toast("<b>คืนค่าเริ่มต้นแล้ว</b>"); });
    $("#wipeBtn").addEventListener("click", () => {
      const n = pendingCount(); if (!confirm(`ล้างการตั้งค่า ข้อมูลที่เก็บไว้ และรายการรอซิงค์ ${n} รายการ ในเครื่องนี้ทั้งหมด?`)) return;
      ["qc.settings", "qc.quality", "qc.edits", "qc.user", "qc.lastUser", "qc.device"].forEach(k => localStorage.removeItem(k)); Q.rows = null; Q.specs = null; route(); toast("<b>ล้างข้อมูลในเครื่องแล้ว</b>");
    });
    $("#logout").addEventListener("click", () => { clearSession(); toast("<b>ออกจากระบบแล้ว</b>"); location.hash = "#/login"; });
    refresh();
    // non-admin: only allow changing the password — hide everything else
    if (getUser().role !== "ผู้ดูแลระบบ") {
      root.querySelector(".set-wrap")?.classList.add("solo");
      root.querySelector(".set-nav")?.remove();
      ["s-sheet", "s-write", "s-def", "s-sys"].forEach(id => root.querySelector("#" + id)?.remove());
      root.querySelectorAll("#s-user .srow").forEach(r => { if (!r.querySelector("#pw")) r.remove(); });
    }
  },
};


route(); renderPhone();
})();
</script>
</body>
</html>
